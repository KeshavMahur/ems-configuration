server:
  port: 8082

spring:
  application:
    name: EMPLOYEE-SERVICE

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:mysql://localhost:3306/employee_service_db?createDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO

resilience4j:

  circuitbreaker:
    instances:
      departmentService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s

  retry:
    instances:
      departmentService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.io.IOException
          - feign.RetryableException
        ignoreExceptions:
          - com.keshav.ems.employeeservice.exceptions.client.DepartmentNotFoundException
          - com.keshav.ems.employeeservice.exceptions.custom.UnknownFeignException

  ratelimiter:
    instances:
      departmentService:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 2s

  bulkhead:
    instances:
      departmentService:
        maxConcurrentCalls: 15
        maxWaitDuration: 500ms
